# Kafka de DevGear: 1 Zookeeper + 3 brokers + Kafka UI + 2 tópicos (3 particiones, 3 réplicas).
# Uso:   copy .env.example .env   (editar KAFKA_EXTERNAL_HOST si es necesario)
#        docker compose up -d
# Kafka UI: http://localhost:8090

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zookeeper
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_LOG_RETENTION_HOURS: 168
    KAFKA_HEAP_OPTS: "-Xms384m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx256m"
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Crea los dos tópicos y termina. Es idempotente: se puede volver a ejecutar sin problema.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka-1:29092,kafka-2:29092,kafka-3:29092
        cub kafka-ready -b $$BS 3 120
        # Alto volumen (clics y carrito): se prioriza rendimiento; retención corta (1 día).
        kafka-topics --bootstrap-server $$BS --create --if-not-exists \
          --topic navegacion.eventos --partitions 3 --replication-factor 3 \
          --config retention.ms=86400000 --config min.insync.replicas=1
        # Intentos de pago (antifraude): se prioriza consistencia; retención de 7 días y 2 réplicas mínimo.
        kafka-topics --bootstrap-server $$BS --create --if-not-exists \
          --topic pagos.intentos --partitions 3 --replication-factor 3 \
          --config retention.ms=604800000 --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: devgear
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_OPTS: "-Xms128m -Xmx256m"

volumes:
  zk-data:
  zk-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
